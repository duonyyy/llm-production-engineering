schema_version: final-lab/v1
status: IMPLEMENTED_NOT_RUN
scrape_targets:
  - component: nginx
    endpoint: http://127.0.0.1:8081/metrics
    required: false
  - component: fastapi
    endpoint: emitted_by_fastapi_metrics_endpoint
    required: true
  - component: rag
    endpoint: emitted_by_fastapi_metrics_endpoint
    required_when_rag_enabled: true
  - component: agent_mcp
    endpoint: NOT_CONFIGURED
    required_when_agent_enabled: true
  - component: vllm
    endpoint: NOT_CONFIGURED
    required: true
dashboards:
  - request_latency_and_errors
  - vllm_gpu_and_kv_cache
  - rag_retrieval_latency_and_empty_results
  - agent_tool_denials_and_failures
metric_label_rules:
  allowed:
    - execution_mode
    - model
    - workload_label
    - route
    - terminal_status
  prohibited:
    - prompt
    - document_content
    - authorization_header
    - token
    - full_request_id
