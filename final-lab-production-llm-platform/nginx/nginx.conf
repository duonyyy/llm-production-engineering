events {}

http {
  # Local educational baseline. TLS termination and public Internet exposure are out of scope.
  limit_req_zone $binary_remote_addr zone=final_lab_per_ip:10m rate=5r/s;

  server {
    listen 8080;
    server_name _;
    client_max_body_size 1m;

    location = /healthz {
      proxy_pass http://127.0.0.1:8081;
    }

    location / {
      limit_req zone=final_lab_per_ip burst=10 nodelay;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Request-ID $http_x_request_id;
      proxy_set_header Authorization $http_authorization;
      proxy_set_header Connection "";
      proxy_buffering off;
      proxy_read_timeout 60s;
      proxy_pass http://127.0.0.1:8081;
    }
  }
}
