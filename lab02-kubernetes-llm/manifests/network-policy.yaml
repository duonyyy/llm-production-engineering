apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: lab02-vllm-default-deny-ingress
  namespace: lab02-kubernetes-llm
spec:
  podSelector:
    matchLabels:
      serving.kserve.io/inferenceservice: lab02-vllm
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector: {}
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - protocol: TCP
          port: 8000
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: lab02-vllm-egress-dns-https
  namespace: lab02-kubernetes-llm
spec:
  podSelector:
    matchLabels:
      serving.kserve.io/inferenceservice: lab02-vllm
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - ports:
        - protocol: TCP
          port: 443
