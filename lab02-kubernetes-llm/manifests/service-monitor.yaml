apiVersion: v1
kind: Service
metadata:
  name: lab02-vllm-metrics
  namespace: lab02-kubernetes-llm
  labels:
    app.kubernetes.io/name: lab02-vllm
    app.kubernetes.io/component: metrics
spec:
  type: ClusterIP
  selector:
    serving.kserve.io/inferenceservice: lab02-vllm
  ports:
    - name: metrics
      port: 8000
      targetPort: 8000
      protocol: TCP
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: lab02-vllm
  namespace: lab02-kubernetes-llm
  labels:
    app.kubernetes.io/name: lab02-vllm
    release: kube-prometheus-stack
spec:
  namespaceSelector:
    matchNames:
      - lab02-kubernetes-llm
  selector:
    matchLabels:
      app.kubernetes.io/name: lab02-vllm
      app.kubernetes.io/component: metrics
  endpoints:
    - port: metrics
      path: /metrics
      interval: 15s
      scrapeTimeout: 10s
